name: Publish Feature Channel

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMS: darwin_arm64 darwin_amd64 linux_amd64 linux_arm64 windows_amd64

jobs:
  resolve:
    runs-on: [homelab]
    outputs:
      enabled: ${{ steps.channel.outputs.enabled }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: omniviewdev/publish-plugin-action/resolve-channel@46937e6bdf076c997b76fb01fc7770c7074d9d9c # v1.3.0
        id: channel
        with:
          kind: plugin
          channels-url: ${{ vars.OMNIVIEW_API_URL }}/v1/plugins/proxmox/channels

  publish:
    needs: resolve
    if: ${{ needs.resolve.outputs.enabled == 'true' }}
    runs-on: [homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platforms
        id: platforms
        run: echo "value=${PLATFORMS// /,}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The runner image is minimal.
      - name: Ensure make
        run: |
          command -v make && exit 0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends make

      - name: Test
        run: make init test

      # Cross-compiles the backend for every platform; CGO is off, so no toolchains needed.
      - name: Build and package
        run: make package VERSION="${{ needs.resolve.outputs.version }}" PLATFORMS="$PLATFORMS"

      # Cluster DNS drops the odd lookup and the publish action does not retry
      # an upload, so resolve the storage host once, with retries, and pin it.
      - name: Pin storage host
        env:
          STORAGE_HOST: ${{ vars.OMNIVIEW_STORAGE_HOST }}
        run: |
          [ -n "$STORAGE_HOST" ] || exit 0
          for attempt in 1 2 3 4 5; do
            ip=$(getent ahostsv4 "$STORAGE_HOST" | awk 'NR==1 {print $1}')
            if [ -n "$ip" ]; then
              echo "$ip $STORAGE_HOST" | sudo tee -a /etc/hosts
              exit 0
            fi
            echo "lookup of $STORAGE_HOST failed (attempt $attempt), retrying"; sleep 5
          done
          exit 1

      - name: Publish to marketplace
        uses: omniviewdev/publish-plugin-action@46937e6bdf076c997b76fb01fc7770c7074d9d9c # v1.3.0
        with:
          api-key: ${{ secrets.OMNIVIEW_API_KEY }}
          api-url: ${{ vars.OMNIVIEW_API_URL }}
          publisher-slug: mononen
          plugin-id: proxmox
          version: ${{ needs.resolve.outputs.version }}
          channel: ${{ needs.resolve.outputs.channel }}
          min-ide-version: "0.30.0"
          artifact-path: dist/
          architectures: ${{ steps.platforms.outputs.value }}
